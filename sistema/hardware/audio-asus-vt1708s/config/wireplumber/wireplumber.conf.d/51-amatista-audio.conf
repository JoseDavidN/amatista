# Tarjeta de audio integrada de la placa ASUS P8H77-V: usar el perfil propio
# (~/.config/alsa-card-profile/mixer/profile-sets/amatista-vt1708s.conf)
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_00_1b.0" } ]
    actions = {
      update-props = {
        api.alsa.use-ucm = false
        device.profile-set = "amatista-vt1708s.conf"
      }
    }
  }
]
