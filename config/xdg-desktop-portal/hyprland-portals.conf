# Portales de escritorio en Hyprland (reemplaza /usr/share/xdg-desktop-portal/hyprland-portals.conf).
# Igual que el de Hyprland, más el portal de secretos de gnome-keyring:
# lo usan las apps aisladas (Flatpak) para guardar contraseñas. Las apps
# normales (Mitis, nm-applet, git) hablan directo con el llavero por D-Bus
# (org.freedesktop.secrets) y no pasan por aquí.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
