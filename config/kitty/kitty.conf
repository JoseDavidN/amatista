# Fuente
font_family      JetBrainsMono Nerd Font
font_size        12.0

# Colores (los mismos de la barra y las notificaciones)
background            #14141c
foreground            #e0e0e0
cursor                #00ff99
selection_background  #2a2a3a

# Aspecto
window_padding_width  8
background_opacity    1.0

# Sin pitido: ahora el audio sale por el televisor
enable_audio_bell     no

# Cambiar el cursor
cursor_shape underline
shell_integration enabled no-cursor

# Tema
include amatista.conf
