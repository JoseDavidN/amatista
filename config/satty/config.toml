# satty - editor de capturas (botón "Editar" de la notificación de captura)
[general]
# Al guardar o copiar se cierra solo
early-exit = true
initial-tool = "arrow"
copy-command = "wl-copy"
annotation-size-factor = 1.5
# Guardar sobrescribe la misma captura (Ctrl+S); Ctrl+C copia al portapapeles
output-filename = "~/Imágenes/Capturas/Captura_%Y-%m-%d_%H-%M-%S-editada.png"
save-after-copy = false
default-hide-toolbars = false
primary-highlighter = "block"

[font]
family = "Noto Sans"
style = "Bold"

# Colores de la paleta Amatista para dibujar
[color-palette]
palette = [
    "#b98cff",
    "#ff9ad5",
    "#ff7a9a",
    "#ffcf85",
    "#9ee6b0",
    "#8fd3ff",
    "#f3eaff",
    "#1e1530",
]
