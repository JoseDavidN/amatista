# mpv - reproductor de video y audio (paleta Amatista)

# Rendimiento: decodificación por hardware cuando sea segura
vo = gpu-next
hwdec = auto-safe
profile = fast

# Ventana
keep-open = yes
save-position-on-quit = yes
autofit-larger = 85%x85%

# Textos en pantalla
osd-font = 'Noto Sans'
osd-font-size = 32
osd-color = '#f3eaff'
osd-border-color = '#1e1530'
osd-border-size = 2
osd-bar-h = 2
osd-bar-w = 60

# Subtítulos
sub-font = 'Noto Sans'
sub-color = '#f3eaff'
sub-border-color = '#1e1530'
slang = es,spa,en,eng
alang = es,spa,en,eng
