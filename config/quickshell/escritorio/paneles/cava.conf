# Configuración de cava para el visualizador del panel de multimedia.
# Salida en texto: una línea por cuadro, valores 0-100 separados por ";"

[general]
bars = 32
framerate = 30
sleep_timer = 0

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 70
